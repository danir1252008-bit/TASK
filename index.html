    /* Firefly spark animation */
    .firefly {
      position: absolute;
      width: 4px;
      height: 4px;
      background-color: #ffe088;
      border-radius: 50%;
      box-shadow: 0 0 10px #ffe088, 0 0 20px #ffe088;
      animation: move 10s infinite alternate, glow 2s infinite alternate;
    }

    @keyframes move {
      0% { transform: translate(0, 0); }
      100% { transform: translate(60px, -60px); }
    }

    @keyframes glow {
      0% { opacity: 0.3; box-shadow: 0 0 5px #ffe088; }
      100% { opacity: 1; box-shadow: 0 0 15px #ffe088, 0 0 25px #ffe088; }
    }

    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(2deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }

    .animate-float-delayed { animation: float 7s ease-in-out 2s infinite; }

                    <span className="font-body-md text-body-md text-on-surface-variant"> / project</span>
                  </div>
                  <ul className="space-y-4 mb-8 font-body-md text-body-md">
                    <li className="flex items-start gap-3"><span className="material-symbols-outlined text-secondary text-[20px] mt-1">check_circle</span><span>Brand Identity System</span></li>
                    <li className="flex items-start gap-3"><span className="material-symbols-outlined text-secondary text-[20px] mt-1">check_circle</span><span>Custom Landing Page</span></li>
                    <li className="flex items-start gap-3"><span className="material-symbols-outlined text-secondary text-[20px] mt-1">check_circle</span><span>SEO & Performance Setup</span></li>
                  </ul>
                  <button onClick={handleSelectPlan} className="w-full py-3.5 rounded-lg border border-secondary/50 text-secondary font-button-text hover:bg-secondary/10 transition-colors mt-auto font-semibold">Visit Stall</button>
                </div>

                {/* Popular */}
                <div className="md:col-span-4 solid-panel rounded-xl p-8 flex flex-col group hover:-translate-y-2 transition-all duration-500 relative overflow-hidden border-2 border-secondary ambient-glow-crimson transform scale-105 z-10 bg-[#1e1c1c]">
                  <div className="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-primary via-secondary to-primary-container"></div>
                  <div className="flex justify-between items-start mb-6">
                    <div className="inline-flex items-center justify-center w-12 h-12 rounded-full bg-surface-container-high border border-outline/30 text-secondary">
                      <span className="material-symbols-outlined">storefront</span>
                    </div>
                    <span className="px-3 py-1 rounded-full border border-primary/50 text-primary font-label-caps text-label-caps bg-primary/10 tracking-widest uppercase">
                      Most Popular
                    </span>
                  </div>
                  <h3 className="font-headline-md text-headline-md text-on-surface mb-2">The Merchant's Manor</h3>
                  <p className="font-body-md text-body-md text-on-surface-variant mb-8 flex-grow leading-relaxed">
                    Sophisticated architecture for growing businesses. Full e-commerce, custom CMS, and integrated growth systems.
                  </p>
                  <div className="mb-8 border-b border-white/10 pb-6">
                    <span className="font-headline-lg text-headline-lg text-secondary">$8,500</span>
                    <span className="font-body-md text-body-md text-on-surface-variant"> / project</span>
                  </div>
                  <ul className="space-y-4 mb-8 font-body-md text-body-md">
                    <li className="flex items-start gap-3"><span className="material-symbols-outlined text-secondary text-[20px] mt-1">check_circle</span><span>Full E-Commerce Platform</span></li>
                    <li className="flex items-start gap-3"><span className="material-symbols-outlined text-secondary text-[20px] mt-1">check_circle</span><span>Advanced Headless CMS</span></li>
                    <li className="flex items-start gap-3"><span className="material-symbols-outlined text-secondary text-[20px] mt-1">check_circle</span><span>Custom Glassmorphic Micro-interactions</span></li>
                  </ul>
                  <button onClick={handleSelectPlan} className="w-full py-4 rounded-lg bg-primary-container text-on-primary-container font-button-text hover:bg-primary-container/80 transition-all crimson-glow mt-auto font-bold">Enter Manor</button>
                </div>

                {/* Enterprise */}
                <div className="md:col-span-4 solid-panel rounded-xl p-8 flex flex-col group hover:-translate-y-2 transition-all duration-500 relative overflow-hidden border border-secondary/20 hover:border-secondary/50">
                  <div className="mb-6 inline-flex items-center justify-center w-12 h-12 rounded-full bg-surface-container-high border border-outline/30 text-secondary">
                    <span className="material-symbols-outlined">castle</span>
                  </div>
                  <h3 className="font-headline-md text-headline-md text-on-surface mb-2">The Empire's Citadel</h3>
                  <p className="font-body-md text-body-md text-on-surface-variant mb-8 flex-grow leading-relaxed">
                    Full-scale custom digital ecosystems for ambitious industry leaders requiring maximum performance and bespoke features.
                  </p>
                  <div className="mb-8 border-b border-white/10 pb-6">
                    <span className="font-headline-lg text-headline-lg text-primary-fixed-dim">$18,500</span>
                    <span className="font-body-md text-body-md text-on-surface-variant"> / project</span>
                  </div>
                  <ul className="space-y-4 mb-8 font-body-md text-body-md">
                    <li className="flex items-start gap-3"><span className="material-symbols-outlined text-secondary text-[20px] mt-1">check_circle</span><span>Bespoke Web App & Custom APIs</span></li>
                    <li className="flex items-start gap-3"><span className="material-symbols-outlined text-secondary text-[20px] mt-1">check_circle</span><span>Multi-Region Infrastructure</span></li>
                    <li className="flex items-start gap-3"><span className="material-symbols-outlined text-secondary text-[20px] mt-1">check_circle</span><span>Interactive 3D / Shader Animations</span></li>
                  </ul>
                  <button onClick={handleSelectPlan} className="w-full py-3.5 rounded-lg border border-secondary/50 text-secondary font-button-text hover:bg-secondary/10 transition-colors mt-auto font-semibold">Claim Citadel</button>
                </div>
              </div>
            </div>
          </section>
        </div>
      );
    };

    // --- Contact Page Component ---
    const ContactPage = () => {
      const [formData, setFormData] = useState({ fullName: '', companyName: '', email: '', phone: '', industry: '', details: '' });
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [submitted, setSubmitted] = useState(false);
      const [errorMessage, setErrorMessage] = useState('');

      const SUPABASE_URL = "https://jusgwmygfdwjwlbkhowb.supabase.co";
      const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_63M5fUayCAc0FK6-5Hkzjw_AneidUzZ";
      const bgImg = "./Hero Page.png";

      const handleChange = (e) => {
        const { id, value } = e.target;
        setFormData(prev => ({ ...prev, [id]: value }));
      };

      const saveToSupabase = async (data) => {
        const headers = {
          'apikey': SUPABASE_PUBLISHABLE_KEY,
          'Content-Type': 'application/json'
        };

        const payload = {
          full_name: data.fullName,
          company_name: data.companyName,
          email: data.email,
          phone: data.phone,
          industry: data.industry,
          details: data.details
        };

        const response = await fetch(`${SUPABASE_URL}/rest/v1/leads`, {
          method: 'POST',
          headers,
          body: JSON.stringify(payload)
        });

        if (!response.ok && response.status !== 201) {
          const errDetails = await response.text();
          throw new Error(`Supabase error (${response.status}): ${errDetails}`);
        }

        return true;
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!formData.fullName || !formData.email) return;
        setIsSubmitting(true);
        setErrorMessage('');

        try {
          await saveToSupabase(formData);
          setSubmitted(true);
        } catch (err) {
          console.error("Supabase Error:", err);
          setErrorMessage("Could not connect to Supabase. Please check your internet connection.");
        } finally {
          setIsSubmitting(false);
        }
      };

      return (
        <main className="flex-grow relative flex items-center justify-center min-h-screen pt-32 pb-section-gap px-container-padding-mobile md:px-container-padding-desktop z-20">
          <div className="absolute inset-0 z-[-1] overflow-hidden">
            <div className="absolute inset-0 bg-background/80 mix-blend-multiply z-10"></div>
            <div className="absolute inset-0 bg-gradient-radial from-primary-container/20 via-background/80 to-background z-20"></div>
            <img alt="Marketplace Background" className="absolute inset-0 w-full h-full object-cover object-center opacity-40 scale-105" src={bgImg} />
          </div>

          <div className="relative z-40 w-full max-w-2xl glass-panel rounded-[24px] p-8 md:p-12 ambient-glow border border-primary-container/30 overflow-hidden my-8">
            <div className="absolute -top-24 -right-24 w-64 h-64 bg-primary-container/20 rounded-full blur-3xl pointer-events-none"></div>
            
            {submitted ? (
              <div className="text-center py-12 relative z-10">
                <div className="inline-flex items-center justify-center w-20 h-20 rounded-full bg-primary-container/20 text-secondary border border-secondary/40 mb-6 lantern-glow">
                  <span className="material-symbols-outlined text-4xl">check_circle</span>
                </div>
                <h2 className="font-headline-lg text-3xl md:text-headline-lg text-on-surface mb-4">Inquiry Saved to Supabase!</h2>
                <p className="font-body-lg text-body-lg text-on-surface-variant max-w-md mx-auto mb-8 leading-relaxed">
                  Thank you, <strong className="text-secondary">{formData.fullName}</strong>. Your details have been saved to Supabase and our team at TASK will reach out to you within 24 hours.
                </p>
                <button onClick={() => { setSubmitted(false); setFormData({ fullName: '', companyName: '', email: '', phone: '', industry: '', details: '' }); }} className="bg-transparent border border-secondary/50 text-secondary font-button-text px-8 py-3 rounded-lg hover:bg-secondary/10 transition-all font-semibold">
                  Submit Another Inquiry
                </button>
              </div>
            ) : (
              <>
                <div className="text-center mb-10 relative z-10">
                  <h1 className="font-headline-lg-mobile md:font-headline-lg text-2xl md:text-headline-lg text-on-surface mb-4 drop-shadow-md leading-tight">
                    Let's Build Something Extraordinary Together
                  </h1>
                  <p className="font-body-lg text-body-lg text-on-surface-variant max-w-lg mx-auto">
                    Tell us about your business and we'll craft a website that helps it stand out, attract customers, and grow online.
                  </p>
                </div>

                <form onSubmit={handleSubmit} className="space-y-6 relative z-10">
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                      <label className="block font-label-caps text-label-caps text-secondary mb-2 uppercase tracking-wider font-semibold" htmlFor="fullName">Full Name *</label>
                      <input className="w-full rounded-lg px-4 py-3 bg-black/70 border border-secondary/40 text-white placeholder-white/40 focus:border-secondary focus:bg-black/90 focus:outline-none focus:ring-1 focus:ring-secondary transition-all font-medium text-base" id="fullName" placeholder="Jane Doe" type="text" required value={formData.fullName} onChange={handleChange} />
                    </div>
                    <div>
                      <label className="block font-label-caps text-label-caps text-secondary mb-2 uppercase tracking-wider font-semibold" htmlFor="companyName">Company Name *</label>
                      <input className="w-full rounded-lg px-4 py-3 bg-black/70 border border-secondary/40 text-white placeholder-white/40 focus:border-secondary focus:bg-black/90 focus:outline-none focus:ring-1 focus:ring-secondary transition-all font-medium text-base" id="companyName" placeholder="Your Business" type="text" required value={formData.companyName} onChange={handleChange} />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                      <label className="block font-label-caps text-label-caps text-secondary mb-2 uppercase tracking-wider font-semibold" htmlFor="email">Email Address *</label>
                      <input className="w-full rounded-lg px-4 py-3 bg-black/70 border border-secondary/40 text-white placeholder-white/40 focus:border-secondary focus:bg-black/90 focus:outline-none focus:ring-1 focus:ring-secondary transition-all font-medium text-base" id="email" placeholder="jane@example.com" type="email" required value={formData.email} onChange={handleChange} />
                    </div>
                    <div>
                      <label className="block font-label-caps text-label-caps text-secondary mb-2 uppercase tracking-wider font-semibold" htmlFor="phone">Phone Number *</label>
                      <input className="w-full rounded-lg px-4 py-3 bg-black/70 border border-secondary/40 text-white placeholder-white/40 focus:border-secondary focus:bg-black/90 focus:outline-none focus:ring-1 focus:ring-secondary transition-all font-medium text-base" id="phone" placeholder="+1 (555) 000-0000" type="tel" required value={formData.phone} onChange={handleChange} />
                    </div>
                  </div>

                  <div>
                    <label className="block font-label-caps text-label-caps text-secondary mb-2 uppercase tracking-wider font-semibold" htmlFor="industry">Business Industry</label>
                    <input className="w-full rounded-lg px-4 py-3 bg-black/70 border border-secondary/40 text-white placeholder-white/40 focus:border-secondary focus:bg-black/90 focus:outline-none focus:ring-1 focus:ring-secondary transition-all font-medium text-base" id="industry" placeholder="e.g. E-Commerce, Retail, Tech" type="text" value={formData.industry} onChange={handleChange} />
                  </div>

                  <div>
                    <label className="block font-label-caps text-label-caps text-secondary mb-2 uppercase tracking-wider font-semibold" htmlFor="details">Project Details</label>
                    <textarea className="w-full rounded-lg px-4 py-3 bg-black/70 border border-secondary/40 text-white placeholder-white/40 focus:border-secondary focus:bg-black/90 focus:outline-none focus:ring-1 focus:ring-secondary transition-all font-medium text-base resize-none" id="details" placeholder="Tell us briefly about your goals..." rows={4} value={formData.details} onChange={handleChange} />
                  </div>

                  <div className="pt-4">
                    <button disabled={isSubmitting} className="w-full bg-primary-container text-on-primary-container font-button-text py-4 rounded-lg lantern-glow hover:bg-inverse-primary hover:scale-[1.02] transition-all flex justify-center items-center gap-2 group font-bold tracking-wider cursor-pointer disabled:opacity-50" type="submit">
                      {isSubmitting ? (
                        <>
                          <span className="animate-spin material-symbols-outlined">sync</span>
                          Saving to Supabase...
                        </>
                      ) : (
                        <>
                          Start My Project
                          <span className="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
                        </>
                      )}
                    </button>
                    <p className="text-center mt-4 font-label-caps text-label-caps text-on-surface-variant/70">
                      ✓ Synced with Supabase • We'll get back to you within 24 hours.
                    </p>
                  </div>
                </form>
              </>
            )}
          </div>
        </main>
      );
    };

    // --- Main App Root ---
    const App = () => {
      const [activeTab, setActiveTab] = useState('home');
      const [isDarkMode, setIsDarkMode] = useState(true);

      return (
        <div className="bg-background text-on-background min-h-screen relative overflow-x-hidden flex flex-col font-body-md text-body-md">
          <div className="fixed inset-0 z-10 noise-bg mix-blend-overlay pointer-events-none"></div>

          <Navbar activeTab={activeTab} setActiveTab={setActiveTab} isDarkMode={isDarkMode} setIsDarkMode={setIsDarkMode} />

          <div className="flex-grow">
            {activeTab === 'home' && <HomePage setActiveTab={setActiveTab} />}
            {activeTab === 'portfolio' && <PortfolioPage setActiveTab={setActiveTab} />}
            {activeTab === 'pricing' && <PricingPage setActiveTab={setActiveTab} />}
            {activeTab === 'contact' && <ContactPage setActiveTab={setActiveTab} />}
          </div>

          <Footer setActiveTab={setActiveTab} />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
