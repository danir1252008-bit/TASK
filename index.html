    body {

      box-shadow: 0 0 15px rgba(193, 18, 31, 0.3);
      outline: none;
    }

    .solid-panel {

    .lantern-glow {

    .ambient-glow {

    }

    .ambient-glow-crimson {

    }

    .text-gradient {
      background: linear-gradient(135deg, #ffd2ce 0%, #e9c349 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .text-glow {
      text-shadow: 0 0 10px rgba(255, 179, 173, 0.5);
    }

    .glow-hover {
      transition: all 0.5s ease;
    }

    .glow-hover:hover {
      box-shadow: 0 0 30px rgba(193, 18, 31, 0.4), 0 0 15px rgba(233, 195, 73, 0.2);
      border-color: rgba(233, 195, 73, 0.6);
    }

    /* Firefly spark animation */
    .firefly {
      position: absolute;
      width: 4px;
      height: 4px;
      background-color: #ffe088;
      border-radius: 50%;
      box-shadow: 0 0 10px #ffe088, 0 0 20px #ffe088;
      animation: move 10s infinite alternate, glow 2s infinite alternate;
    }

    @keyframes move {
      0% { transform: translate(0, 0); }
      100% { transform: translate(60px, -60px); }
    }

    @keyframes glow {
      0% { opacity: 0.3; box-shadow: 0 0 5px #ffe088; }
      100% { opacity: 1; box-shadow: 0 0 15px #ffe088, 0 0 25px #ffe088; }
    }

    @keyframes float {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(2deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }

    .animate-float { animation: float 6s ease-in-out infinite; }
    .animate-float-delayed { animation: float 7s ease-in-out 2s infinite; }

    /* From Uiverse.io by prikshit_1236 */ 
    .theme-toggle-wrapper {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      transition: 0.6s ease-in-out;
      font-family: "Arial", sans-serif;
    }

    .theme-toggle-wrapper .toggle-switch {
      position: relative;
      display: inline-block;
      width: 80px;
      height: 40px;
      transform: scale(0.65);
      transform-origin: center center;
      transition: transform 0.2s;
    }

    .theme-toggle-wrapper .toggle-switch:hover {
      transform: scale(0.72);
    }

    .theme-toggle-wrapper .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .theme-toggle-wrapper .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(145deg, #f1c40f, #f39c12);
      transition: 0.4s;
      border-radius: 34px;
      box-shadow: 0 0 15px rgba(241, 196, 15, 0.5);
    }

    .theme-toggle-wrapper .slider:before {
      position: absolute;
      content: "☀️";
      height: 32px;
      width: 32px;
      left: 4px;
      bottom: 4px;
      background: white;
      transition: 0.4s;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      z-index: 2;
    }

    .theme-toggle-wrapper input:checked + .slider {
      background: linear-gradient(145deg, #2c3e50, #34495e);
      box-shadow: 0 0 15px rgba(44, 62, 80, 0.5);
    }

    .theme-toggle-wrapper input:checked + .slider:before {
      transform: translateX(40px);
      content: "🌙";
    }

    .theme-toggle-wrapper .clouds {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
    }

    .theme-toggle-wrapper .cloud {
      position: absolute;
      width: 20px;
      height: 20px;
      fill: rgba(255, 255, 255, 0.8);
      transition: all 0.4s ease;
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.1));
    }

    .theme-toggle-wrapper .cloud1 {
      top: 10px;
      left: 10px;
      animation: floatCloud1 8s infinite linear;
    }

    .theme-toggle-wrapper .cloud2 {
      top: 15px;
      left: 40px;
      transform: scale(0.8);
      animation: floatCloud2 12s infinite linear;
    }

    @keyframes floatCloud1 {
      0% {
        transform: translateX(-20px);
        opacity: 0;
      }
      20% {
        opacity: 1;
      }
      80% {
        opacity: 1;
      }
      100% {
        transform: translateX(80px);
        opacity: 0;
      }
    }

    @keyframes floatCloud2 {
      0% {
        transform: translateX(-20px) scale(0.8);
        opacity: 0;
      }
      20% {
        opacity: 0.7;
      }
      80% {
        opacity: 0.7;
      }
      100% {
        transform: translateX(80px) scale(0.8);
        opacity: 0;
      }
    }

    .theme-toggle-wrapper input:checked + .slider .cloud {
      opacity: 0;
      transform: translateY(-20px);
    }

    @media (prefers-reduced-motion: reduce) {
      .theme-toggle-wrapper .cloud {
        animation: none;
      }
    }

        filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.9)) !important;
      }
    }
  </style>
</head>

                  <button onClick={() => { setActiveTab('privacy'); window.scrollTo({ top: 0, behavior: 'smooth' }); }} className="inline-flex items-center gap-2 bg-transparent border border-secondary/40 text-secondary px-6 py-3 rounded-lg font-button-text text-xs hover:bg-secondary/10 transition-all font-semibold tracking-wider cursor-pointer">
                    View Privacy Policy
                  </button>
                </div>
              </div>
            </div>
          </main>

          {/* Floating Back to Top Button */}
          {showBackToTop && (
            <button onClick={scrollToTop} className="fixed bottom-8 right-8 z-50 w-12 h-12 rounded-full bg-primary-container text-on-primary-container border border-secondary/40 shadow-[0_0_20px_rgba(229,9,20,0.4)] flex items-center justify-center hover:scale-110 active:scale-95 transition-all crimson-glow cursor-pointer" title="Back to Top">
              <span className="material-symbols-outlined text-2xl">arrow_upward</span>
            </button>
          )}
        </div>
      );
    };

    // --- Main App Root ---
    const App = () => {
      const [activeTab, setActiveTab] = useState('home');
      const [isDarkMode, setIsDarkMode] = useState(() => {
        const savedTheme = localStorage.getItem('task_theme');
        if (savedTheme) return savedTheme === 'dark';
        return false; // Default to Light Mode on first visit!
      });

      useEffect(() => {
        if (isDarkMode) {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
          localStorage.setItem('task_theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
          localStorage.setItem('task_theme', 'light');
        }
      }, [isDarkMode]);

      return (
        <div className="bg-background text-on-background min-h-screen relative overflow-x-hidden flex flex-col font-body-md text-body-md">
          <div className="fixed inset-0 z-10 noise-bg mix-blend-overlay pointer-events-none"></div>

          <Navbar activeTab={activeTab} setActiveTab={setActiveTab} isDarkMode={isDarkMode} setIsDarkMode={setIsDarkMode} />

          <div className="flex-grow">
            {activeTab === 'home' && <HomePage setActiveTab={setActiveTab} isDarkMode={isDarkMode} />}
            {activeTab === 'portfolio' && <PortfolioPage setActiveTab={setActiveTab} isDarkMode={isDarkMode} />}
            {activeTab === 'pricing' && <PricingPage setActiveTab={setActiveTab} isDarkMode={isDarkMode} />}
            {activeTab === 'contact' && <ContactPage setActiveTab={setActiveTab} isDarkMode={isDarkMode} />}
            {activeTab === 'privacy' && <PrivacyPolicyPage setActiveTab={setActiveTab} isDarkMode={isDarkMode} />}
            {activeTab === 'terms' && <TermsPage setActiveTab={setActiveTab} isDarkMode={isDarkMode} />}
          </div>

          <Footer setActiveTab={setActiveTab} />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
