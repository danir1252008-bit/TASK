      const savedTheme = localStorage.getItem('task_theme');
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark');
        document.documentElement.classList.remove('light');
      } else {
        document.documentElement.classList.remove('dark');
        document.documentElement.classList.add('light');
      }
    })();

  <style>
    .noise-bg {
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
    }
    .lantern-glow {
      box-shadow: 0 0 30px rgba(229, 183, 0, 0.35);
    }
    .lantern-glow:hover {
      box-shadow: 0 0 50px rgba(255, 224, 136, 0.6);
    }
    .text-glow {
      text-shadow: 0 0 20px rgba(255, 224, 136, 0.4);
    }
    .glass-panel {
      background: rgba(28, 27, 27, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .solid-panel {
      background: #1c1b1b;
    }
    .glow-hover:hover {
      box-shadow: 0 0 30px rgba(230, 190, 0, 0.25);
    }
    html.light {
      --tw-bg-opacity: 1;
      background-color: rgb(248 246 240 / var(--tw-bg-opacity));
      color: #141313;
    }
    html.light .glass-panel {
      background: rgba(255, 255, 255, 0.85);
      border-color: rgba(230, 190, 0, 0.3);
    }
    html.light .solid-panel {
      background: #ffffff;
    }
    html.light .text-on-surface {
      color: #1c1b1b;
    }
    html.light .text-on-surface-variant {
      color: #49473a;
    }
    html.light .text-on-background {
      color: #141313;
    }
    html.light nav {
      background-color: rgba(255, 255, 255, 0.9) !important;
      border-color: rgba(230, 190, 0, 0.4) !important;
    }
    .theme-toggle-wrapper {
      display: inline-block;
    }
    .toggle-switch {
      position: relative;
      width: 60px;
      height: 30px;
      --light: #d8dbe0;
      --dark: #28292c;
      --link: #57585a;
      --link-hover: #0071e3;
    }
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #52627a;
      transition: .4s;
      border-radius: 30px;
      overflow: hidden;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 22px;
      width: 22px;
      left: 4px;
      bottom: 4px;
      background-color: #f6d140;
      transition: .4s;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(246, 209, 64, 0.8);
      z-index: 2;
    }
    input:checked + .slider {
      background-color: #181c24;
    }
    input:checked + .slider:before {
      transform: translateX(30px);
      background-color: #e6e6e6;
      box-shadow: inset -3px -2px 0 0 #a9b2c3, 0 0 8px rgba(255, 255, 255, 0.5);
    }
    .slider .clouds {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      transition: opacity 0.4s ease;
    }
    .slider .cloud {
      position: absolute;
      fill: #ffffff;
      opacity: 0.85;
    }
    .slider .cloud1 {
      width: 18px;
      height: 18px;
      right: 6px;
      bottom: 2px;
    }
    .slider .cloud2 {
      width: 14px;
      height: 14px;
      right: 20px;
      bottom: 8px;
      opacity: 0.6;
    }
    input:checked + .slider .clouds {
      opacity: 0;
    }
  </style>
