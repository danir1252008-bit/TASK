                  <div className="w-full h-px bg-gradient-to-r from-primary/30 via-secondary/20 to-transparent mb-6"></div>
                  <p className="font-body-md text-body-md text-on-surface-variant leading-relaxed mb-4">{sec.content}</p>
                  {sec.bullets && (
                    <ul className="space-y-3 mt-4 font-body-md text-body-md text-on-surface/90">
                      {sec.bullets.map((bullet, idx) => (
                        <li key={idx} className="flex items-start gap-3">
                          <span className="material-symbols-outlined text-primary text-[18px] mt-1 shrink-0">check_circle</span>
                          <span>{bullet}</span>
                        </li>
                      ))}
                    </ul>
                  )}
                  {sec.note && (
                    <div className="mt-4 p-4 rounded-xl bg-primary/5 border border-primary/20 text-xs text-primary-fixed-dim font-medium">{sec.note}</div>
                  )}
                  {sec.actionTab && (
                    <button onClick={() => { setActiveTab(sec.actionTab); window.scrollTo({ top: 0, behavior: 'smooth' }); }} className="mt-4 inline-flex items-center gap-2 text-secondary hover:text-white font-label-caps text-xs tracking-wider uppercase group-hover:translate-x-1 transition-all">
                      {sec.actionText}
                      <span className="material-symbols-outlined text-sm">arrow_forward</span>
                    </button>
                  )}
                </div>
              ))}

              {/* Section 14: Highlighted Contact Information Card */}
              <div id="contact-info" className="solid-panel bg-gradient-to-br from-[#1c1b1b]/95 via-[#121212]/95 to-[#0a0a0a]/95 backdrop-blur-xl rounded-2xl p-8 md:p-12 border-2 border-primary/40 shadow-[0_0_35px_rgba(229,9,20,0.25)] relative overflow-hidden mt-12">
                <div className="absolute top-0 right-0 w-64 h-64 bg-primary-container/20 rounded-full blur-3xl pointer-events-none"></div>
                <div className="flex items-center gap-3 mb-6">
                  <span className="material-symbols-outlined text-primary text-3xl">gavel</span>
                  <div>
                    <h3 className="font-headline-md text-2xl text-on-surface font-bold">14. Contact Information</h3>
                    <p className="font-body-md text-sm text-on-surface-variant">Questions regarding these Terms & Conditions should be directed to our legal team.</p>
                  </div>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 pt-4 border-t border-white/10">
                  <div className="space-y-4">
                    <div>
                      <span className="font-label-caps text-xs text-secondary uppercase block mb-1">Company Name</span>
                      <span className="font-headline-md text-lg text-white font-bold">TASK</span>
                    </div>
                    <div>
                      <span className="font-label-caps text-xs text-secondary uppercase block mb-1">Legal & Billing Email</span>
                      <a href="mailto:Taskfromindia@gmail.com" className="font-body-md text-on-surface hover:text-primary transition-colors font-medium">Taskfromindia@gmail.com</a>
                    </div>
                    <div>
                      <span className="font-label-caps text-xs text-secondary uppercase block mb-1">Direct Phone</span>
                      <a href="tel:+919310040848" className="font-body-md text-on-surface hover:text-primary transition-colors font-medium">+91 93100 40848</a>
                    </div>
                  </div>
                  <div className="space-y-4">
                    <div>
                      <span className="font-label-caps text-xs text-secondary uppercase block mb-1">Official Website</span>
                      <a href="https://task-orpin-gamma.vercel.app/" target="_blank" rel="noopener noreferrer" className="font-body-md text-on-surface hover:text-primary transition-colors font-medium">https://task-orpin-gamma.vercel.app/</a>
                    </div>
                    <div>
                      <span className="font-label-caps text-xs text-secondary uppercase block mb-1">Registered Address</span>
                      <span className="font-body-md text-on-surface font-medium block">Kolkata, West Bengal, India</span>
                    </div>
                    <div>
                      <span className="font-label-caps text-xs text-secondary uppercase block mb-1">Last Updated</span>
                      <span className="font-body-md text-white font-semibold">August 06, 2026</span>
                    </div>
                  </div>
                </div>
                <div className="mt-8 pt-6 border-t border-white/10 flex flex-wrap gap-4 items-center justify-between">
                  <button onClick={() => { setActiveTab('contact'); window.scrollTo({ top: 0, behavior: 'smooth' }); }} className="inline-flex items-center gap-2 bg-primary-container text-on-primary-container px-6 py-3 rounded-lg font-button-text text-xs hover:bg-primary-container/80 transition-all font-bold tracking-wider crimson-glow cursor-pointer">
                    Contact Agency Legal Team
                    <span className="material-symbols-outlined text-sm">arrow_forward</span>
                  </button>
                  <button onClick={() => { setActiveTab('privacy'); window.scrollTo({ top: 0, behavior: 'smooth' }); }} className="inline-flex items-center gap-2 bg-transparent border border-secondary/40 text-secondary px-6 py-3 rounded-lg font-button-text text-xs hover:bg-secondary/10 transition-all font-semibold tracking-wider cursor-pointer">
                    View Privacy Policy
                  </button>
                </div>
              </div>
            </div>
          </main>

          {/* Floating Back to Top Button */}
          {showBackToTop && (
            <button onClick={scrollToTop} className="fixed bottom-8 right-8 z-50 w-12 h-12 rounded-full bg-primary-container text-on-primary-container border border-secondary/40 shadow-[0_0_20px_rgba(229,9,20,0.4)] flex items-center justify-center hover:scale-110 active:scale-95 transition-all crimson-glow cursor-pointer" title="Back to Top">
              <span className="material-symbols-outlined text-2xl">arrow_upward</span>
            </button>
          )}
        </div>
      );
    };

    // --- Main App Root ---
    const App = () => {
      const [activeTab, setActiveTab] = useState('home');
      const [isDarkMode, setIsDarkMode] = useState(() => {
        const savedTheme = localStorage.getItem('task_theme');
        if (savedTheme) return savedTheme === 'dark';
        return false; // Default to Light Mode on first visit!
      });

      useEffect(() => {
        if (isDarkMode) {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
          localStorage.setItem('task_theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
          localStorage.setItem('task_theme', 'light');
        }
      }, [isDarkMode]);

      return (
        <div className="bg-background text-on-background min-h-screen relative overflow-x-hidden flex flex-col font-body-md text-body-md">
          <div className="fixed inset-0 z-10 noise-bg mix-blend-overlay pointer-events-none"></div>

          <Navbar activeTab={activeTab} setActiveTab={setActiveTab} isDarkMode={isDarkMode} setIsDarkMode={setIsDarkMode} />

          <div className="flex-grow">
            {activeTab === 'home' && <HomePage setActiveTab={setActiveTab} isDarkMode={isDarkMode} />}
            {activeTab === 'portfolio' && <PortfolioPage setActiveTab={setActiveTab} isDarkMode={isDarkMode} />}
            {activeTab === 'pricing' && <PricingPage setActiveTab={setActiveTab} isDarkMode={isDarkMode} />}
            {activeTab === 'contact' && <ContactPage setActiveTab={setActiveTab} isDarkMode={isDarkMode} />}
            {activeTab === 'privacy' && <PrivacyPolicyPage setActiveTab={setActiveTab} isDarkMode={isDarkMode} />}
            {activeTab === 'terms' && <TermsPage setActiveTab={setActiveTab} isDarkMode={isDarkMode} />}
          </div>

          <Footer setActiveTab={setActiveTab} />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
